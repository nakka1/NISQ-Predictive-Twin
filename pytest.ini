[pytest]
markers =
    unit: fast, isolated unit tests (no training, no heavy simulation)
    physics: quantum-physics validation and regression tests (channel, memory, purification, swapping, environment)
    integration: multi-component end-to-end tests (dataset+model, full pipelines, package-level)
    slow: tests that train models or run substantial simulation (may take >10s each)
    experimental: newer, less-validated test coverage for recently-added features

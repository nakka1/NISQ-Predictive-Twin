<svg width="680" height="640" viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Quantum Repeater Digital Twin architecture</title>
<desc>WDM telemetry flows through an optical causal chain into a quantum channel, producing ground-truth fidelity used to train ML models, which feed a controller that issues HALT, WAIT, or PURIFY actions to the quantum dataplane.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="640" fill="#ffffff"/>

<g>
<rect x="40" y="30" width="230" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="155" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">WDM telemetry source</text>
<text x="155" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">synthetic / CSV / live</text>
</g>

<g>
<rect x="410" y="30" width="230" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="525" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Quantum physics engine</text>
<text x="525" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">Aer reference | Kraus fast</text>
</g>

<line x1="155" y1="86" x2="155" y2="120" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="525" y1="86" x2="525" y2="120" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="120" width="230" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="155" y="144" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Optical causal chain</text>
<text x="155" y="162" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">phase drift to OSNR to BER</text>
</g>

<g>
<rect x="410" y="120" width="230" height="66" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="525" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Quantum channel</text>
<text x="525" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">T1/T2/depol to density matrix</text>
</g>

<line x1="270" y1="153" x2="408" y2="153" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="339" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">causal chain</text>

<line x1="155" y1="186" x2="155" y2="230" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="205" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">WDM-observable</text>

<path d="M525 186 L525 210 L 300 210 L 300 250" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.7"/>
<text x="525" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">F(t), ground truth</text>

<g>
<rect x="80" y="230" width="240" height="66" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="200" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">EdgeLSTM / DualHead / Ensemble</text>
<text x="200" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">trained on WDM features + F(t)</text>
</g>

<line x1="200" y1="296" x2="200" y2="330" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="290" y="313" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">P(available), F_hat, sigma</text>


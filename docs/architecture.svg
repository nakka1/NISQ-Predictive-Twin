<text x="145" y="540" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993556">BBPSSW</text>
<text x="145" y="556" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993556">F_before/F_after</text>
</g>

<g>
<rect x="240" y="500" width="150" height="70" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="315" y="522" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4B1528">Swapping</text>
<text x="315" y="540" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993556">Werner state</text>
<text x="315" y="556" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993556">real BSM</text>
</g>

<g>
<rect x="410" y="500" width="200" height="70" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="510" y="522" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4B1528">Memory / multi-hop</text>
<text x="510" y="540" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993556">real decoherence,</text>
<text x="510" y="556" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993556">closed-loop environment</text>
</g>

</svg>

<text x="200" y="370" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">Blind, Reactive, Predictive, Oracle,</text>
</g>
<text x="200" y="404" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">Three-state, Risk-aware</text>

<line x1="200" y1="396" x2="200" y2="440" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="290" y="423" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">HALT / WAIT / PURIFY</text>

<g>
<rect x="40" y="450" width="600" height="150" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="70" y="478" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Quantum dataplane</text>
